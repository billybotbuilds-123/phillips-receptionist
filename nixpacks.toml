[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npx tsc --noEmit"]

[start]
cmd = "echo 'Node:' $(node --version) && echo 'TSX:' $(npx tsx --version 2>&1 || echo NOT_FOUND) && npx prisma db push --skip-generate && npx tsx src/index.ts 2>&1"
